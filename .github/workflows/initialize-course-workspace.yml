name: Initialize course workspace

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the verified starter files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, zipfile
          root = Path.cwd().resolve()
          archive = root / 'econ3735-workspace.zip'
          archive.write_bytes(base64.b64decode(''))
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '85bdd9cd1c23d4862b145e04e0e3c1ea9753a3fae998bef1c65e7b337823ecc5'
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  parts = PurePosixPath(name).parts
                  assert parts[0] == 'econ3735-workspace' and '..' not in parts
                  if name.endswith('/'):
                      continue
                  target = (root / Path(*parts[1:])).resolve()
                  assert target.is_relative_to(root) and '.git' not in parts
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
          archive.unlink()
          (root / '.github/workflows/initialize-course-workspace.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Install ECON/BUS 3735 Fall 2026 starter workspace'
          git push origin HEAD:main
